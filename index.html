<!doctype html>
<html lang="es" data-theme="light">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Heurísticas y Metaheurísticas · Optimización</title>
 <link rel="stylesheet" href="presentacion/shared/tokens.css">
 <link rel="stylesheet" href="presentacion/shared/viewer.css">
 <script defer src="presentacion/shared/viewer.js"></script>
</head>
<body class="slide-theme">
<main id="presentation">
 <section class="cover screen" id="cover" aria-labelledby="coverTitle">
  <div class="cover-inner">
   <header class="institution">
    <span>Universidad Externado de Colombia</span>
    <span>Ciencia de Datos · Optimización</span>
   </header>
   <div class="cover-heading">
    <h1 id="coverTitle">Heurísticas y<br>Metaheurísticas</h1>
    <p>Estrategias de búsqueda para problemas de optimización</p>
   </div>
   <div class="themes" role="group" aria-label="Algoritmos">
    <button type="button" data-topic="local" data-algo="local" class="slide-theme" aria-pressed="false">
     <span class="theme-letter">A</span><strong>Búsqueda Local</strong><span>Mejora por vecindarios</span>
    </button>
    <button type="button" data-topic="tabu" data-algo="tabu" class="slide-theme" aria-pressed="false">
     <span class="theme-letter">B</span><strong>Búsqueda Tabú</strong><span>Exploración con memoria</span>
    </button>
    <button type="button" data-topic="ga" data-algo="ga" class="slide-theme" aria-pressed="false">
     <span class="theme-letter">C</span><strong>Algoritmos Genéticos</strong><span>Evolución de soluciones</span>
    </button>
    <button type="button" data-topic="aco" data-algo="aco" class="slide-theme" aria-pressed="false">
     <span class="theme-letter">D</span><strong>Colonia de Hormigas</strong><span>Rutas guiadas por feromonas</span>
    </button>
   </div>
   <button id="start" class="primary" type="button" disabled>Iniciar presentación <span aria-hidden="true">→</span></button>
  </div>
 </section>

 <section id="viewer" aria-label="Modo presentación" hidden>
  <iframe id="slideFrame" title="Diapositivas" tabindex="-1"></iframe>
  <div class="controls-zone" id="controlsZone">
   <nav class="controls" id="controls" aria-label="Controles de presentación">
    <button type="button" id="previous" aria-label="Anterior" title="Anterior (←)">←</button>
    <span><strong id="person"></strong> <span id="count" aria-live="polite"></span></span>
    <button type="button" id="next" aria-label="Siguiente" title="Siguiente (→)">→</button>
    <button type="button" id="fullscreen" aria-label="Pantalla completa" title="Pantalla completa (F)" aria-pressed="false">⛶</button>
    <button type="button" id="return">Portada</button>
   </nav>
  </div>
 </section>

 <section class="cover screen" id="finished" aria-labelledby="finishTitle" hidden>
  <div class="cover-inner closing">
   <p class="institution" id="finishedTopic"></p>
   <h1 id="finishTitle" tabindex="-1">Preguntas</h1>
   <a class="study-link" id="appendix" target="_blank" rel="noopener">Anexo de Carolina</a>
   <button class="primary" id="restart" type="button">Volver a la portada</button>
  </div>
 </section>
 <span class="sr-only" id="fullscreenStatus" role="status"></span>
</main>
</body>
</html>
