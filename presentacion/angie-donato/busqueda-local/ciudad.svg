<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500">
  <title>Ciudad de entregas</title>
  <desc>Calles con cruces y rutas alternativas conectan un depósito, viviendas, un mercado, un hospital, oficinas y una biblioteca.</desc>
  <defs>
    <g id="tree">
      <ellipse cx="3" cy="10" rx="12" ry="5" fill="#d3dbcb"/>
      <path d="M0 3v8" stroke="#7f8270" stroke-width="2"/>
      <path d="M-11 2C-17-7-6-18 1-19 10-17 16-9 11 0 7 8-7 9-11 2Z" fill="#9fb09a"/>
      <path d="M-4 5 0-6l4-4" fill="none" stroke="#6c8979" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g id="house">
      <path d="m6 68 85 3 29-14-68-15Z" fill="#d2dbca"/>
      <path d="M14 30h66v37H14Z" fill="#f9f2df"/>
      <path d="m80 30 25-14v37L80 67Z" fill="#dad2bb"/>
      <path d="m6 31 38-29 44 29Z" fill="#8499bd"/>
      <path d="m44 2 25-9 40 23-21 15Z" fill="#adbcda"/>
      <path d="M47 45h16v22H47Z" fill="#839b88"/>
      <path d="M24 43h14v13H24Z" fill="#a2b4d0"/>
      <path d="M31 43v13m-7-6h14" stroke="#f9f2df" stroke-width="1.5"/>
    </g>
    <pattern id="windows" width="26" height="23" patternUnits="userSpaceOnUse">
      <rect x="5" y="5" width="15" height="13" rx="2" fill="#98aeca"/>
      <path d="M12.5 5v13" stroke="#e9edf0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="920" height="500" fill="#eeefe6"/>
  <path d="M0 21C159 31 203 0 330 0H0Zm920 424c-55-28-107-15-140 2s-38 35-110 53h250Z" fill="#e1e8da"/>

  <!-- Las manzanas y las calles ofrecen varias conexiones entre destinos. -->
  <g fill="#e2e8da" stroke="#d1dacb" stroke-width="1.5">
    <rect x="50" y="20" width="210" height="196" rx="22"/>
    <rect x="291" y="20" width="255" height="196" rx="22"/>
    <rect x="584" y="20" width="286" height="196" rx="22"/>
    <rect x="50" y="286" width="247" height="185" rx="22"/>
    <rect x="336" y="286" width="240" height="185" rx="22"/>
    <rect x="616" y="286" width="255" height="185" rx="22"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-25 250h970M270-20v250q0 20 21 20m271-270v250q0 20 24 20M315 520V272q0-22-24-22m305 270V272q0-22-22-22M33-16v532m856-532v532M-16 484h952" stroke="#d7d8c9" stroke-width="35"/>
    <path d="M-25 250h970M270-20v250q0 20 21 20m271-270v250q0 20 24 20M315 520V272q0-22-24-22m305 270V272q0-22-22-22M33-16v532m856-532v532M-16 484h952" stroke="#fbfaf6" stroke-width="30"/>
    <path d="M-10 250h940M270 0v219M562 0v218M315 500V281M596 500V280M33 0v500m856-500v500M0 484h920" stroke="#d1d2c5" stroke-width="1.5" stroke-dasharray="9 9"/>
    <path d="M122 216v24m24-24v24m528-24v24m22-24v24M155 270v18m22-18v18m540-18v18m22-18v18" stroke="#fbfaf6" stroke-width="8"/>
  </g>
  <g stroke="#d0d0c1" stroke-width="2">
    <path d="M252 232h15m-15 5h15m-15 5h15m-15 5h15m331 15h15m-15 5h15m-15 5h15m-15 5h15"/>
  </g>

  <!-- Depósito de salida. -->
  <g transform="translate(84 51)">
    <use href="#tree" x="-12" y="99"/>
    <use href="#tree" x="143" y="77"/>
    <path d="m10 103 131 10 18-31-98-9Z" fill="#d2dbca"/>
    <path d="M5 47h112v58H5Z" fill="#adbed9"/>
    <path d="m117 47 26-16v59l-26 15Z" fill="#8199bf"/>
    <path d="m-1 44 59-30 65 30Z" fill="#3d5a98"/>
    <path d="m58 14 22-9 66 26-23 13Z" fill="#718ab4"/>
    <path d="M21 64h30v41H21Zm50 0h30v41H71Z" fill="#f8f2df"/>
    <path d="M25 74h22m-22 8h22m-22 8h22m28-16h22m-22 8h22m-22 8h22" stroke="#b3b5a6" stroke-width="2"/>
  </g>

  <!-- Barrio residencial. -->
  <g transform="translate(310 65)">
    <use href="#house" x="3" y="7"/>
    <use href="#house" x="115" y="31"/>
    <use href="#tree" x="14" y="111"/>
    <use href="#tree" x="89" y="91"/>
    <use href="#tree" x="211" y="48"/>
  </g>

  <!-- Hospital. -->
  <g transform="translate(650 41)">
    <use href="#tree" x="-24" y="117"/>
    <use href="#tree" x="165" y="103"/>
    <path d="m4 126 115 10 38-29-117-10Z" fill="#d2dbca"/>
    <path d="M9 51h109v74H9Z" fill="#fcfaf4"/>
    <path d="m118 51 33-16v73l-33 17Z" fill="#c8d5d0"/>
    <path d="m9 51 37-16h105l-33 16Z" fill="#dee8df"/>
    <path d="M43 26h41v38H43Z" fill="#fcfaf4"/>
    <path d="M61 32h7v24h-7Zm-8 8h23v7H53Z" fill="#a75155"/>
    <path d="M21 72h84v18H21Z" fill="#a1b7ca"/>
    <path d="M42 72v18m21-18v18m21-18v18" stroke="#fcfaf4" stroke-width="3"/>
    <path d="M49 99h27v26H49Z" fill="#779488"/>
  </g>

  <!-- Tienda con toldo rayado. -->
  <g transform="translate(93 304)">
    <use href="#tree" x="145" y="103"/>
    <use href="#tree" x="-20" y="58"/>
    <path d="m3 113 111 10 37-20-108-15Z" fill="#d2dbca"/>
    <path d="M9 43h114v69H9Z" fill="#f3e7ce"/>
    <path d="m123 43 25-12v67l-25 14Z" fill="#dbc9a7"/>
    <path d="m9 43 25-12h114l-25 12Z" fill="#c38a69"/>
    <path d="M31 76h50v26H31Zm62 0h20v36H93Z" fill="#91aba1"/>
    <path d="M0 69 11 51h112l13 18Z" fill="#fcf4dc"/>
    <path d="m8 69 10-18h14l-7 18Zm33 0 4-18h14l-1 18Zm33 0-1-18h14l4 18Zm33 0-7-18h14l10 18Z" fill="#b97454"/>
    <path d="M58 76v26m-27-13h50" stroke="#fcf4dc" stroke-width="2"/>
  </g>

  <!-- Edificios de oficinas. -->
  <g transform="translate(367 301)">
    <use href="#tree" x="-8" y="105"/>
    <use href="#tree" x="155" y="99"/>
    <path d="m5 113 111 11 35-16-96-14Z" fill="#d2dbca"/>
    <path d="M20 25h71v89H20Z" fill="#dce5ef"/>
    <path d="m91 25 26-13v87l-26 15Z" fill="#a7b8ce"/>
    <path d="m20 25 29-13h68L91 25Z" fill="#f0f3f4"/>
    <path d="M22 32h66v61H22Z" fill="url(#windows)"/>
    <path d="M95 53h31v54H95Z" fill="#bccdbf"/>
    <path d="m126 53 18-8v52l-18 10Z" fill="#96ab9d"/>
    <path d="m95 53 18-8h31l-18 8Z" fill="#d5e1d5"/>
    <path d="M47 99h20v15H47Z" fill="#6a889c"/>
  </g>

  <!-- Biblioteca. -->
  <g transform="translate(674 312)">
    <use href="#tree" x="-24" y="89"/>
    <use href="#tree" x="155" y="85"/>
    <path d="m0 104 108 8 39-20-96-10Z" fill="#d2dbca"/>
    <path d="M8 44h116v58H8Z" fill="#faf1db"/>
    <path d="m124 44 24-18v60l-24 16Z" fill="#d1bd9c"/>
    <path d="m4 45 63-29 61 29Z" fill="#8da698"/>
    <path d="m67 16 26-9 55 19-20 19Z" fill="#a9bfb1"/>
    <path d="M24 54h14v34H24Zm70 0h14v34H94Z" fill="#a4b9c7"/>
    <path d="M55 100V70a12 12 0 0 1 24 0v30Z" fill="#749087"/>
    <path d="M8 94h116m-120 7h125" stroke="#d5c4a5" stroke-width="3"/>
  </g>

  <g font-family="system-ui,sans-serif" font-size="19" font-weight="680" text-anchor="middle" fill="#304842">
    <rect x="67" y="170" width="175" height="34" rx="11" fill="#e7ecf7"/>
    <text x="155" y="193" fill="#3d5a98">Depósito · salida</text>
    <text x="423" y="193">Viviendas</text>
    <text x="722" y="193">Hospital</text>
    <text x="172" y="449">Mercado</text>
    <text x="451" y="449">Oficinas</text>
    <text x="743" y="449">Biblioteca</text>
  </g>
</svg>
